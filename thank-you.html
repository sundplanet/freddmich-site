<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — FREDDMICH Integrated Solutions</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--gold:#C5A059;--gold-bright:#D4AF37;--gold-soft:#e7cf92;--ink:#0b0a07;--line:#2c2516;--text:#efe7d6;--muted:#a9a08b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:radial-gradient(circle at 50% 0%,#1c1708,#000 70%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
.card{max-width:540px;width:100%;background:linear-gradient(180deg,#1c1810,#141109);border:1px solid var(--line);border-radius:22px;padding:52px 40px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.logo{height:84px;margin-bottom:22px;filter:drop-shadow(0 12px 30px rgba(197,160,89,.4))}
.check{width:84px;height:84px;margin:0 auto 24px;border-radius:50%;background:linear-gradient(135deg,var(--gold-bright),var(--gold));display:flex;align-items:center;justify-content:center;color:#1a1405;font-size:2.4rem;font-weight:800;box-shadow:0 0 40px rgba(197,160,89,.35);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
h1{font-size:2rem;color:#fff;margin-bottom:12px}
h1 span{background:linear-gradient(135deg,var(--gold-bright),var(--gold-soft));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{color:var(--muted);font-size:1.05rem;margin-bottom:10px}
.rule{width:64px;height:3px;background:linear-gradient(90deg,var(--gold-bright),var(--gold));margin:20px auto;border-radius:3px}
.btn{display:inline-block;margin-top:14px;padding:13px 30px;border-radius:9px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1405;transition:.2s}
.btn:hover{filter:brightness(1.08)}
.fname{margin-top:34px;color:var(--gold);font-weight:800;letter-spacing:1px;font-size:.95rem}
.contact{margin-top:6px;color:var(--muted);font-size:.85rem}
@media(prefers-reduced-motion:reduce){.check{animation:none}}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="logo.png" alt="FREDDMICH Integrated Solutions">
  <div class="check">&#10003;</div>
  <h1>Thank <span>you!</span></h1>
  <div class="rule"></div>
  <p>Your message has been received by <strong style="color:#fff">FREDDMICH INTEGRATED SOLUTIONS</strong>.</p>
  <p>Our team will get back to you within one business day.</p>
  <a class="btn" href="index.html">Back to Home</a>
  <div class="fname">FREDDMICH INTEGRATED SOLUTIONS</div>
  <div class="contact">info@freddmichsoluttions.com.ng &middot; +234 816 446 2920</div>
</div>
</body>
</html>
